name: Build PR Preview

on:
  pull_request:
    paths-ignore:
      - '.gitignore'
      - 'LICENSE'
      - '*.adoc'
      - '*.txt'
      - '.all-contributorsrc'
jobs:
  build-artefact:
    name: Build artefact
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21.0.12+101.0.LTS
          cache: 'maven'
      - name: Build project
        run: mvn -B clean verify --file pom.xml
